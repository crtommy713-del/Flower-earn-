<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Earn - Earn Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at top, rgba(217, 119, 6, 0.15), transparent 50%);
            color: #f8fafc;
            padding-bottom: 90px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.4rem;
        }
        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbbf24;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .ad-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .ad-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .ad-counter {
            font-size: 0.75rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ad-reward {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .ad-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.2);
        }
        .ad-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ Earn Hub</h1>
        <p>Watch sponsored links to grow your flower balance!</p>
    </div>

    <div class="container">
        <div class="section-title">
            <span>Watch & Earn</span>
            <span id="availableAdsCount">4 available</span>
        </div>

        <div class="ads-grid">
            <!-- AD #1 -->
            <div class="ad-card" id="cardAd1">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #1</span>
                        <span class="ad-counter" id="count1">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd1" onclick="watchAd(1)">WATCH</button>
            </div>

            <!-- AD #2 -->
            <div class="ad-card" id="cardAd2">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #2</span>
                        <span class="ad-counter" id="count2">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd2" onclick="watchAd(2)">WATCH</button>
            </div>

            <!-- AD #3 -->
            <div class="ad-card" id="cardAd3">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #3</span>
                        <span class="ad-counter" id="count3">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd3" onclick="watchAd(3)">WATCH</button>
            </div>

            <!-- AD #4 -->
            <div class="ad-card" id="cardAd4">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #4</span>
                        <span class="ad-counter" id="count4">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd4" onclick="watchAd(4)">WATCH</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> HOME</a>
        <a href="earn.html" class="nav-item active"><span class="nav-icon">⚡</span> EARN</a>
        <a href="game.html" class="nav-item"><span class="nav-icon">⭐</span> PLAY</a>
        <a href="friends.html" class="nav-item"><span class="nav-icon">👥</span> FRIENDS</a>
        <a href="wallet.html" class="nav-item"><span class="nav-icon">👤</span> ME</a>
    </div>

    <script>
        // Mapping each ad slot to your individual links
        const adLinks = {
            1: "https://omg10.com/4/11910761",
            2: "https://omg10.com/4/11496906",
            3: "https://omg10.com/4/11910754",
            4: "https://omg10.com/4/11505493"
        };

        const maxPerAd = 5; // Limit per ad link daily

        function getTodayKey(adId) {
            return `ad_${adId}_count_` + new Date().toISOString().slice(0, 10);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });

        function updateUI() {
            for (let i = 1; i <= 4; i++) {
                const key = getTodayKey(i);
                const currentViews = Number(localStorage.getItem(key) || 0);
                
                document.getElementById(`count${i}`).innerText = `${currentViews}/${maxPerAd}`;

                if (currentViews >= maxPerAd) {
                    const btn = document.getElementById(`btnAd1` + (i === 1 ? '' : i)); // fixed selector below
                    document.getElementById(`btnAd${i}`).innerText = "COMPLETED";
                    document.getElementById(`btnAd${i}`).disabled = true;
                }
            }
        }

        function watchAd(adId) {
            const key = getTodayKey(adId);
            let currentViews = Number(localStorage.getItem(key) || 0);

            if (currentViews >= maxPerAd) {
                alert("You have reached the daily limit for this ad!");
                return;
            }

            // Increment views and balance
            currentViews += 1;
            localStorage.setItem(key, currentViews);

            let currentBalance = Number(localStorage.getItem('flowerBalance') || 761);
            currentBalance += 50;
            localStorage.setItem('flowerBalance', currentBalance);

            updateUI();

            // Open the specific link for this ad slot
            window.open(adLinks[adId], '_blank');
        }
    </script>
</body>
</html>
