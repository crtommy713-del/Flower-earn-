<!DOCTYPE html>

<head>

    <!-- Monetag SDK Script Tag -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at top, rgba(217, 119, 6, 0.15), transparent 50%);
            color: #f8fafc;
            padding-bottom: 90px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.4rem;
        }
        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbbf24;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .ad-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .ad-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .ad-counter {
            font-size: 0.75rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .ad-reward {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .ad-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.2);
        }
        .ad-btn:disabled {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fbbf24;
            cursor: not-allowed;
            box-shadow: none;
            font-size: 0.75rem;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ Earn Hub</h1>
        <p>Watch rewarded ads every 4 hours to grow your balance!</p>
    </div>

    <div class="container">
        <div class="section-title">
            <span>Watch & Earn</span>
            <span id="availableAdsCount">4 available</span>
        </div>

        <div class="ads-grid">
            <!-- AD #1 -->
            <div class="ad-card">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #1</span>
                        <span class="ad-counter" id="count1">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd1" onclick="watchAdSlot(1)">WATCH</button>
            </div>

            <!-- AD #2 -->
            <div class="ad-card">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #2</span>
                        <span class="ad-counter" id="count2">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd2" onclick="watchAdSlot(2)">WATCH</button>
            </div>

            <!-- AD #3 -->
            <div class="ad-card">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #3</span>
                        <span class="ad-counter" id="count3">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd3" onclick="watchAdSlot(3)">WATCH</button>
            </div>

            <!-- AD #4 -->
            <div class="ad-card">
                <div>
                    <div class="ad-header">
                        <span class="ad-title">Ad #4</span>
                        <span class="ad-counter" id="count4">0/5</span>
                    </div>
                    <div class="ad-reward">🌸 50</div>
                </div>
                <button class="ad-btn" id="btnAd4" onclick="watchAdSlot(4)">WATCH</button>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> HOME</a>
        <a href="earn.html" class="nav-item active"><span class="nav-icon">⚡</span> EARN</a>
        <a href="game.html" class="nav-item"><span class="nav-icon">⭐</span> PLAY</a>
        <a href="friends.html" class="nav-item"><span class="nav-icon">👥</span> FRIENDS</a>
        <a href="wallet.html" class="nav-item"><span class="nav-icon">👤</span> ME</a>
    </div>

    <script>
        const maxPerAd = 5;
        const cooldownTimeMs = 4 * 60 * 60 * 1000; // 4 Hours in milliseconds

        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
            setInterval(updateUI, 1000); // Live update timers every second
        });

        function updateUI() {
            const now = new Date().getTime();

            for (let i = 1; i <= 4; i++) {
                const viewsKey = `ad_${i}_views`;
                const cooldownKey = `ad_${i}_cooldown_until`;

                let currentViews = Number(localStorage.getItem(viewsKey) || 0);
                let cooldownUntil = Number(localStorage.getItem(cooldownKey) || 0);

                document.getElementById(`count${i}`).innerText = `${currentViews}/${maxPerAd}`;
                const btn = document.getElementById(`btnAd${i}`);

                if (currentViews >= maxPerAd) {
                    if (now >= cooldownUntil) {
                        // Cooldown expired, reset the slot
                        localStorage.setItem(viewsKey, '0');
                        localStorage.setItem(cooldownKey, '0');
                        btn.innerText = "WATCH";
                        btn.disabled = false;
                        document.getElementById(`count${i}`).innerText = `0/${maxPerAd}`;
                    } else {
                        // Show active countdown timer
                        const distance = cooldownUntil - now;
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        btn.innerText = `⏳ ${hours}h ${minutes}m ${seconds}s`;
                        btn.disabled = true;
                    }
                } else {
                    btn.innerText = "WATCH";
                    btn.disabled = false;
                }
            }
        }

        function watchAdSlot(adId) {
            const viewsKey = `ad_${adId}_views`;
            const cooldownKey = `ad_${adId}_cooldown_until`;

            let currentViews = Number(localStorage.getItem(viewsKey) || 0);

            if (currentViews >= maxPerAd) {
                return;
            }

            // Direct fallback links for each ad slot
            const fallbackLinks = {
                1: "https://omg10.com/4/11910761",
                2: "https://omg10.com/4/11496906",
                3: "https://omg10.com/4/11910754",
                4: "https://omg10.com/4/11505493"
            };

            const grantRewardAndOpenAd = () => {
                currentViews += 1;
                localStorage.setItem(viewsKey, currentViews);

                if (currentViews >= maxPerAd) {
                    const cooldownExpiry = new Date().getTime() + cooldownTimeMs;
                    localStorage.setItem(cooldownKey, cooldownExpiry);
                }

                let currentBalance = Number(localStorage.getItem('flowerBalance') || 761);
                currentBalance += 50;
                localStorage.setItem('flowerBalance', currentBalance);

                updateUI();
                alert('You have seen an ad! +50 Flowers added.');
            };

            // Try Monetag SDK first; seamlessly fall back to direct links if loading or blocked
            if (typeof show_11911077 === 'function') {
                show_11911077().then(() => {
                    grantRewardAndOpenAd();
                }).catch((error) => {
                    console.log("SDK ad failed, opening fallback link", error);
                    window.open(fallbackLinks[adId], '_blank');
                    grantRewardAndOpenAd();
                });
            } else {
                window.open(fallbackLinks[adId], '_blank');
                grantRewardAndOpenAd();
            }
        }
    </script>
</body>
</html>
