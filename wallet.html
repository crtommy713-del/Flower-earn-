<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Earn - Wallet & Payout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at top, rgba(217, 119, 6, 0.15), transparent 50%);
            color: #f8fafc;
            padding-bottom: 90px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.4rem;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        .balance-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 4px;
        }
        .balance-naira {
            font-size: 0.95rem;
            color: #34d399;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
        }
        .form-input:focus {
            border-color: #fbbf24;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #fbbf24;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.2);
            margin-top: 10px;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        
        /* Withdrawal History Section */
        .history-section {
            margin-top: 30px;
        }
        .history-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-info div:first-child {
            font-size: 0.9rem;
            font-weight: bold;
            color: #f8fafc;
        }
        .history-info div:last-child {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 3px;
        }
        .history-status {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
        }
        .empty-history {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            padding: 15px;
            background: #1e293b;
            border: 1px dashed #334155;
            border-radius: 12px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 Wallet & Payout</h1>
    </div>

    <div class="container">
        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-title">Available Balance</div>
            <div class="balance-amount" id="flowerDisplay">0 Flowers</div>
            <div class="balance-naira" id="nairaDisplay">₦0.00</div>
        </div>

        <!-- Withdrawal Form -->
        <div class="form-group">
            <label class="form-label">Bank Name</label>
            <input type="text" id="bankName" class="form-input" placeholder="e.g. Opay, Kuda">
        </div>

        <div class="form-group">
            <label class="form-label">Account Number</label>
            <input type="number" id="accountNumber" class="form-input" placeholder="Enter 10-digit account number">
        </div>

        <div class="form-group">
            <label class="form-label">Account Name</label>
            <input type="text" id="accountName" class="form-input" placeholder="Enter account holder name">
        </div>

        <button class="submit-btn" onclick="submitWithdrawal()">SUBMIT WITHDRAWAL</button>

        <!-- Withdrawal History Section -->
        <div class="history-section">
            <div class="history-title">Withdrawal History</div>
            <div class="history-list" id="historyList">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> HOME</a>
        <a href="earn.html" class="nav-item"><span class="nav-icon">⚡</span> EARN</a>
        <a href="game.html" class="nav-item"><span class="nav-icon">⭐</span> PLAY</a>
        <a href="friends.html" class="nav-item"><span class="nav-icon">👥</span> FRIENDS</a>
        <a href="wallet.html" class="nav-item active"><span class="nav-icon">👤</span> ME</a>
    </div>

    <script>
        // Fixed Exchange Rate: 5,000 Flowers = 500 Naira
        const conversionRate = 500 / 5000; 
        const minWithdrawalFlowers = 5000;

        window.addEventListener('DOMContentLoaded', () => {
            loadWalletData();
            loadWithdrawalHistory();
        });

        function loadWalletData() {
            let balance = Number(localStorage.getItem('flowerBalance') || 5026);
            document.getElementById('flowerDisplay').innerText = `${balance.toLocaleString()} Flowers`;
            
            let nairaValue = balance * conversionRate;
            document.getElementById('nairaDisplay').innerText = `₦${nairaValue.toFixed(2)}`;
        }

        function submitWithdrawal() {
            let balance = Number(localStorage.getItem('flowerBalance') || 5026);
            let bankName = document.getElementById('bankName').value.trim();
            let accountNumber = document.getElementById('accountNumber').value.trim();
            let accountName = document.getElementById('accountName').value.trim();

            if (balance < minWithdrawalFlowers) {
                alert(`Minimum withdrawal is ${minWithdrawalFlowers.toLocaleString()} Flowers!`);
                return;
            }

            if (!bankName || !accountNumber || !accountName) {
                alert("Please fill in all banking details correctly.");
                return;
            }

            let nairaAmount = (balance * conversionRate).toFixed(2);

            // Send notification to Telegram
            sendTelegramNotification(bankName, accountNumber, accountName, balance, nairaAmount);

            // Deduct balance and save history
            let payoutRecord = {
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                flowers: balance,
                naira: nairaAmount,
                bank: bankName,
                account: accountNumber,
                name: accountName
            };

            let history = JSON.parse(localStorage.getItem('withdrawalHistory') || '[]');
            history.unshift(payoutRecord);
            localStorage.setItem('withdrawalHistory', JSON.stringify(history));

            // Reset balance after payout request
            localStorage.setItem('flowerBalance', '0');

            alert('Withdrawal request submitted successfully!');
            loadWalletData();
            loadWithdrawalHistory();

            // Clear inputs
            document.getElementById('bankName').value = '';
            document.getElementById('accountNumber').value = '';
            document.getElementById('accountName').value = '';
        }

        function sendTelegramNotification(bank, accNo, accName, flowers, naira) {
            // Your Telegram Bot Token and Group Chat ID
            const TELEGRAM_BOT_TOKEN = "7927840249:AAG...your_token_here"; // Replace or ensure your token is correct
            const TELEGRAM_CHAT_ID = "-1003949521064";

            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.includes("your_token_here")) {
                console.log("Telegram Token not configured properly.");
                return;
            }

            const message = `<b>🔔 New Withdrawal Request</b>\n\n` +
                            `🌸 <b>Flowers:</b> ${flowers.toLocaleString()}\n` +
                            `💵 <b>Amount:</b> ₦${naira}\n` +
                            `🏦 <b>Bank:</b> ${bank}\n` +
                            `🔢 <b>Account No:</b> ${accNo}\n` +
                            `👤 <b>Name:</b> ${accName}`;

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.ok) {
                    console.error("Telegram Error:", data.description);
                }
            })
            .catch(err => console.error("Telegram API Network Error:", err));
        }

        function loadWithdrawalHistory() {
            let historyListContainer = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('withdrawalHistory') || '[]');

            if (history.length === 0) {
                historyListContainer.innerHTML = `<div class="empty-history">No withdrawal history yet.</div>`;
                return;
            }

            let html = '';
            history.forEach(item => {
                html += `
                    <div class="history-item">
                        <div class="history-info">
                            <div>₦${item.naira} (${item.flowers.toLocaleString()} Flowers)</div>
                            <div>${item.bank} - ${item.account} | ${item.date}</div>
                        </div>
                        <div class="history-status">Pending</div>
                    </div>
                `;
            });

            historyListContainer.innerHTML = html;
        }
    </script>
</body>
</html>
