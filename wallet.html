<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Earn - Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at top, rgba(217, 119, 6, 0.15), transparent 50%);
            color: #f8fafc;
            padding-bottom: 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.5rem;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        .balance-card {
            background: linear-gradient(135deg, #d97706, #b45309);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }
        .balance-card h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #fef3c7;
        }
        .balance-card .amount {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
        }
        .withdrawal-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .withdrawal-card h3 {
            margin-bottom: 15px;
            color: #fbbf24;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        .withdrawal-card input, .withdrawal-card select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        .withdrawal-card button {
            width: 100%;
            padding: 14px;
            background: #fbbf24;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .withdrawal-card button:active {
            background: #d97706;
        }
        /* Navigation bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            text-align: center;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>My Wallet & Payouts</h1>
    </div>

    <div class="container">
        <!-- Balance Display Card -->
        <div class="balance-card">
            <h2>Available Balance</h2>
            <div class="amount" id="userBalance">0.00 Flowers</div>
        </div>

        <!-- Withdrawal Form Section -->
        <div class="withdrawal-card">
            <h3>Request Payout (NGN)</h3>
            
            <div class="form-group">
                <label for="accountName">Account Name</label>
                <input type="text" id="accountName" placeholder="e.g. John Oluwaseun" required>
            </div>

            <div class="form-group">
                <label for="accountNumber">10-Digit Account Number</label>
                <input type="number" id="accountNumber" placeholder="Enter 10-digit number" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="bankName">Select Bank</label>
                <select id="bankName" required>
                    <option value="">-- Choose Bank / Provider --</option>
                    <option value="OPay">OPay (Paycom)</option>
                    <option value="Moniepoint">Moniepoint MFB</option>
                    <option value="Kuda">Kuda Bank</option>
                    <option value="Access Bank">Access Bank</option>
                    <option value="GTBank">Guaranty Trust Bank (GTB)</option>
                    <option value="UBA">United Bank for Africa (UBA)</option>
                    <option value="First Bank">First Bank of Nigeria</option>
                    <option value="PalmPay">PalmPay</option>
                </select>
            </div>

            <div class="form-group">
                <label for="withdrawalAmount">Amount to Withdraw (Flowers)</label>
                <input type="number" id="withdrawalAmount" placeholder="Enter amount (Min 5,000)" required>
            </div>

            <button onclick="submitWithdrawalRequest()">Submit Withdrawal Request</button>
        </div>
    </div>

    <!-- Standard Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span> HOME
        </a>
        <a href="earn.html" class="nav-item">
            <span class="nav-icon">⚡</span> EARN
        </a>
        <a href="game.html" class="nav-item">
            <span class="nav-icon">⭐</span> PLAY
        </a>
        <a href="friends.html" class="nav-item">
            <span class="nav-icon">👥</span> FRIENDS
        </a>
        <a href="wallet.html" class="nav-item active">
            <span class="nav-icon">👤</span> ME
        </a>
    </div>

    <!-- Firebase SDK & Withdrawal Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9C-bNkvpueC3qK2TxO1PU_goLavCQiBk",
            authDomain: "flower-earn.firebaseapp.com",
            projectId: "flower-earn",
            storageBucket: "flower-earn.appspot.com",
            messagingSenderId: "799031720926",
            appId: "1:799031720926:web:68f997c2d135242f463b4f",
            measurementId: "G-JMLSY039Z2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
    </script>

    <script>
        // Load stored balance on page start
        window.addEventListener('DOMContentLoaded', () => {
            const savedFlowers = localStorage.getItem('flowerBalance') || '761'; // Defaults to 761 if set, or reads stored amount
            document.getElementById('userBalance').innerText = `${Number(savedFlowers).toLocaleString()} Flowers`;
        });

        async function submitWithdrawalRequest() {
            const accountName = document.getElementById('accountName').value.trim();
            const accountNumber = document.getElementById('accountNumber').value.trim();
            const bankName = document.getElementById('bankName').value;
            const amount = Number(document.getElementById('withdrawalAmount').value);
            const currentBalance = Number(localStorage.getItem('flowerBalance') || '761');

            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const telegramId = tgUser ? tgUser.id.toString() : "anonymous_user";
            const username = tgUser ? tgUser.username || tgUser.first_name : "User";

            // Check if user has enough balance
            if (amount > currentBalance) {
                alert("You cannot withdraw more than your available balance!");
                return;
            }

            // Silent Background Profit Guard Checks
            const minWithdrawalFlowers = 5000; 
            if (amount < minWithdrawalFlowers) {
                alert(`Minimum withdrawal limit is ${minWithdrawalFlowers.toLocaleString()} Flowers.`);
                return;
            }

            const completedAdViews = Number(localStorage.getItem('monetag_verified_views') || 0);
            const requiredAdViews = 15; 

            if (completedAdViews < requiredAdViews) {
                alert("Withdrawal requirement not met. Please complete more tasks and ad views to unlock payouts.");
                return;
            }

            if (!accountName || accountNumber.length !== 10 || !bankName) {
                alert("Please fill in all fields correctly and ensure your account number is 10 digits.");
                return;
            }

            try {
                const withdrawalRef = doc(collection(window.db, 'withdrawals'));
                await setDoc(withdrawalRef, {
                    userId: telegramId,
                    username: username,
                    accountName: accountName,
                    accountNumber: accountNumber,
                    bankName: bankName,
                    amount: amount,
                    adViewsRecorded: completedAdViews,
                    status: "Pending",
                    createdAt: serverTimestamp()
                });

                const botToken = "8524825030:AAEpGVofXlPtYyvaZnvVHu-BYnjC4DqGZr8"; 
                const chatId = "-1003949521064";       

                const messageText = `🔔 *NEW WITHDRAWAL REQUEST*%0A%0A` +
                                    `👤 *User:* @${username} (ID: \`${telegramId}\`)%0A` +
                                    `🏷️ *Account Name:* ${accountName}%0A` +
                                    `🔢 *Account No:* \`${accountNumber}\`%0A` +
                                    `🏦 *Bank:* ${bankName}%0A` +
                                    `💵 *Amount:* ${amount} Flowers%0A` +
                                    `📈 *Verified Ads:* ${completedAdViews} views%0A` +
                                    `⏳ *Status:* Pending`;

                const telegramApiUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${messageText}&parse_mode=Markdown`;

                fetch(telegramApiUrl).catch(err => console.log("Telegram notification error:", err));

                alert("Withdrawal request submitted successfully! Status: Pending.");
                
                // Deduct balance locally
                const newBalance = currentBalance - amount;
                localStorage.setItem('flowerBalance', newBalance);
                document.getElementById('userBalance').innerText = `${newBalance.toLocaleString()} Flowers`;

                localStorage.setItem('monetag_verified_views', '0');
                document.getElementById('accountName').value = '';
                document.getElementById('accountNumber').value = '';
                document.getElementById('withdrawalAmount').value = '';
                
            } catch (error) {
                console.error("Error submitting withdrawal: ", error);
                alert("Failed to submit request. Please try again.");
            }
        }
    </script>
</body>
</html>
